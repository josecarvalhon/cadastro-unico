version: 2

sources:
  - name: bronze
    description: "Camada Bronze — dados brutos extraídos das fontes, em Parquet no MinIO."
    meta:
      external_location: "s3://lakehouse/bronze/{name}/**/*.parquet"
    # _ingested_at é gravado como string ISO 8601 pelo conector Bronze
    # (ver ingest/bronze/_common.py). CAST permite o dbt comparar com NOW().
    loaded_at_field: "CAST(_ingested_at AS TIMESTAMP)"
    freshness:
      warn_after: { count: 12, period: hour }
      error_after: { count: 36, period: hour }
    tables:
      - name: empresa_a_clientes
        meta:
          external_location: "s3://lakehouse/bronze/empresa_a/clientes/**/*.parquet"
        columns:
          - name: _source
            tests: [not_null]
          - name: _batch_id
            tests: [not_null]
      - name: empresa_a_fornecedores
        meta:
          external_location: "s3://lakehouse/bronze/empresa_a/fornecedores/**/*.parquet"
      - name: empresa_b_clientes
        meta:
          external_location: "s3://lakehouse/bronze/empresa_b/clientes/**/*.parquet"
      - name: empresa_c_fornecedores
        meta:
          external_location: "s3://lakehouse/bronze/empresa_c/fornecedores/**/*.parquet"
      - name: empresa_d_clientes
        meta:
          external_location: "s3://lakehouse/bronze/empresa_d/clientes/**/*.parquet"
      - name: empresa_d_fornecedores
        meta:
          external_location: "s3://lakehouse/bronze/empresa_d/fornecedores/**/*.parquet"
      - name: empresa_e_clientes
        meta:
          external_location: "s3://lakehouse/bronze/empresa_e/clientes/**/*.parquet"
